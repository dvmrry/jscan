[package]
name = "jscan"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Agent-friendly structural reconnaissance for JSON and JSONL"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.39", features = ["derive"] }
ignore = "0.4.23"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.20.0"
